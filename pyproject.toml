[project]
name = "voicenote"
# 版本号只认 src/voicenote/__init__.py 里那一处。写两份迟早会漂，
# 而发 Release 时版本号对不上是很难看的事。
dynamic = ["version"]
description = "低启动成本的电脑端语音记录工具 —— 想到什么直接说，后台自动记录并实时转成文字"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    # 图形界面（托盘 + 主窗口 + 设置页）。用 Essentials 而不是完整 PySide6：
    # 本项目只用到 QtCore/QtGui/QtWidgets，Essentials 正好覆盖，
    # 能省掉 Addons（QtWebEngine/QtMultimedia 等）约 100MB+ 的安装体积。
    "PySide6-Essentials>=6.8",
    "pillow>=10",
    # Windows GPU 推理所需：ctranslate2 在 Windows 上不会自带这两个 DLL，
    # 必须由这两个包提供 cudnn64_9.dll / cublas64_12.dll。
    "nvidia-cudnn-cu12>=9; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12; sys_platform == 'win32'",
]

[project.optional-dependencies]
# NVIDIA Parakeet V3 走 NeMo 推理，依赖体积很大，因此不放入默认安装。
parakeet = ["nemo_toolkit[asr]>=2.4"]

[project.scripts]
voicenote = "voicenote.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/voicenote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voicenote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src 布局：不装包也能直接跑 pytest（CI 与开发机都省一步安装）。
pythonpath = ["src"]
